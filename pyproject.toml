[project]
name = "docsbuild"
version = "0.1.1"
description = "Build markdown doc sets into self-contained HTML sites. CommonMark via markdown-it-py."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Douglas Watts", email = "douglaslwatts@protonmail.com" }]
keywords = ["documentation", "markdown", "static-site-generator", "docs"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]

# Kept small and pure-Python. These are safe to depend on because a consumer *installs*
# this tool rather than vendoring it, so what docsbuild needs never reaches their project:
# `uv tool install docsbuild` leaves their own dependency tree untouched. markdown-it-py
# brings only mdurl with it.
dependencies = [
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
]

[project.scripts]
docsbuild = "docsbuild:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsbuild"]

[tool.pytest.ini_options]
addopts = "--cov=docsbuild --cov-report=term-missing --cov-fail-under=95 --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
# `python -m docsbuild` is exercised by a subprocess test, which coverage cannot see
# from inside this process. Measuring it would report 0% for code that is proven to run.
omit = ["src/docsbuild/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
